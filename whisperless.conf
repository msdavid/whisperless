# whisperless configuration — shell-style KEY=value
# Client-side values are read live at each dictation.
# Server-side values need `./install.sh` re-run to take effect (they're baked
# into the systemd unit). Installed to ~/.config/whisperless/config.conf.

# ---- ASR server -------------------------------------------------------------
SERVER_DIR="$HOME/apps/r2t2/Confucius4-R2T2"  # R2T2 checkout; venv + models live here
PORT=8272
BIND_IP=127.0.0.1        # keep loopback unless you serve other machines
GPU_INDEX=0
GPU_MEM_UTIL=0.55        # vLLM gpu_memory_utilization (upstream default 0.95 needs the whole GPU)
MAX_MODEL_LEN=8192       # KV cache context cap; 8192 fits 16GB GPUs alongside a desktop

# ---- client -----------------------------------------------------------------
HOTKEY="CTRL + space"    # keybind (lua syntax; converted automatically for sway/i3/.conf)
VOICE_LANG=English       # English | Chinese | zhen (auto zh+en) | other model languages
MAX_SECS=120             # auto-finalize dictation after N seconds
SETTLE_DELAY=0.15        # pause before typing; avoids WM modifier race (stuck SUPER)
GRACE_TAIL=0.25          # extra mic capture after stop so the last word isn't clipped
TRAILING_SPACE=1         # append a space after the inserted text
NOTIFY=1                 # desktop notifications on start/finish (0 = silent)
MIC_TARGET=              # pw-record --target; empty = PipeWire default source
                         # (list sources: wpctl status; e.g. MIC_TARGET=60)
TYPER=auto               # text injection: auto | wtype | ydotool | xdotool
WM=auto                  # window manager for bind setup: auto | hyprland | sway | i3 | other
BORDER=1                 # Hyprland: focused window border turns red while recording
BORDER_COLOR="rgba(ff3333ff)"       # active border while recording
BORDER_INACTIVE_COLOR="rgba(ff333355)"  # inactive borders while recording
